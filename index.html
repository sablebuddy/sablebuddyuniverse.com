<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHD Toolkit — навигатор навыков</title>
<meta name="description" content="Интерактивный навигатор навыков при СДВГ: выбери проблему, получи конкретный навык с инструкцией «Что делать» и объяснением «Почему работает». Таблица эмоций и когнитивные ловушки.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --bg:#f8f9fa; --card:#ffffff; --border:#e0e0e0;
  --blue:#0f3460; --red:#e94560;
  --h:#1a1a2e; --text:#333; --hint:#4a4a6a;
  --active-bg:#fff5f7;
  --tag-red-bg:#ffe0e0; --tag-red-text:#c0392b;
  --tag-blue-bg:#cce5ff; --tag-purple-bg:#e0e0ff;
  --tag-green-bg:#d4edda; --tag-yellow-bg:#fff3cd;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:0.95rem; line-height:1.6;
}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 64px}

/* ===== Header ===== */
header{padding:28px 0 18px;text-align:center}
header h1{font-size:1.7rem;font-weight:700;color:var(--h)}
header p{color:var(--hint);font-size:0.9rem;margin-top:4px}
.hero-photos{display:flex;justify-content:center;gap:14px;margin-bottom:16px}
.hero-photos img{
  width:120px;height:120px;object-fit:cover;border-radius:16px;
  border:2px solid var(--border);transition:all 0.2s ease;
}
.hero-photos img:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 6px 18px rgba(15,52,96,.12)}
@media(max-width:520px){.hero-photos img{width:96px;height:96px}}
.logo-row{display:flex;align-items:center;justify-content:center;gap:12px}
.logo-row img{height:56px;width:auto}
@media(max-width:520px){.logo-row img{height:44px}}
.card .c-img{
  display:block; height:110px; width:auto; max-width:100%;
  object-fit:contain; margin:0 auto 10px;
  transition:transform 0.2s ease;
}
.card:hover .c-img{transform:scale(1.06)}
@media(max-width:520px){.card .c-img{height:96px}}

/* ===== Tabs ===== */
.tabbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 26px}
.tab-btn{
  border:2px solid var(--border); background:var(--card); color:var(--hint);
  font:inherit; font-weight:700; font-size:0.9rem;
  padding:10px 18px; border-radius:12px; cursor:pointer;
  transition:all 0.2s ease;
}
.tab-btn:hover{border-color:var(--blue);color:var(--blue)}
.tab-btn.active{border-color:var(--red);background:var(--active-bg);color:var(--red)}
.tab-pane{display:none}
.tab-pane.active{display:block;animation:fadeIn 0.3s ease}

/* ===== Grids & cards ===== */
.grid{display:grid;gap:14px}
.grid-zones{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid-cats{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{
  background:var(--card); border:2px solid var(--border); border-radius:14px;
  padding:18px 16px; cursor:pointer; transition:all 0.2s ease;
}
.card:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 6px 18px rgba(15,52,96,.10)}
.card.selected{border-color:var(--red);background:var(--active-bg)}
.card .c-emoji{font-size:1.5rem;line-height:1;display:block;margin-bottom:8px}
.card .c-title{font-size:1.1rem;font-weight:700;color:var(--h)}
.card .c-sub{font-size:0.82rem;color:var(--hint);margin-top:6px;line-height:1.45}
.card .c-selftalk{
  font-size:0.8rem;color:var(--hint);margin-top:8px;font-style:italic;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ===== Section titles & back buttons ===== */
.crumb-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.back-btn{
  border:2px solid var(--border); background:var(--card); color:var(--blue);
  font:inherit; font-weight:700; font-size:0.85rem;
  padding:8px 14px; border-radius:12px; cursor:pointer; transition:all 0.2s ease;
}
.back-btn:hover{border-color:var(--blue);transform:translateY(-2px)}
h2{font-size:1.5rem;font-weight:700;color:var(--h);margin-bottom:16px}
h3.zone-title{font-size:1.25rem;font-weight:700;color:var(--h)}

/* ===== Tags ===== */
.tag{
  display:inline-block; font-size:0.7rem; font-weight:700; text-transform:uppercase;
  letter-spacing:.04em; padding:4px 12px; border-radius:12px; margin-bottom:8px;
}
.tag-red{background:var(--tag-red-bg);color:var(--tag-red-text)}
.tag-blue{background:var(--tag-blue-bg);color:var(--blue)}
.tag-purple{background:var(--tag-purple-bg);color:var(--h)}
.tag-green{background:var(--tag-green-bg);color:#1e6b3a}
.tag-yellow{background:var(--tag-yellow-bg);color:#8a6d1a}

/* ===== Level 3 panel ===== */
.panel{
  background:var(--card); border:2px solid var(--border); border-radius:14px;
  padding:22px 20px; margin-top:18px; animation:fadeIn 0.3s ease;
}
.panel-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.selftalk-box{margin-bottom:18px}
.selftalk-box .st-list{color:var(--tag-red-text);font-style:italic;font-size:0.92rem}
.intro-box{margin-bottom:18px}
.intro-box .i-quote{
  font-size:1.15rem;font-weight:700;color:var(--h);line-height:1.4;margin-bottom:10px;
}
.intro-box .i-text{font-size:0.92rem;color:var(--text);line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{
  border:none; background:var(--blue); color:#fff; font:inherit;
  font-size:0.85rem; font-weight:700; padding:8px 16px; border-radius:999px;
  cursor:pointer; transition:all 0.2s ease;
}
.chip:hover{background:var(--red);transform:translateY(-2px)}
.chip.active{background:var(--red)}
.detail-box{
  margin-top:16px; border-top:2px dashed var(--border); padding-top:16px;
  animation:fadeIn 0.3s ease;
}
.detail-box .d-problem{font-weight:700;color:var(--h);margin-bottom:12px;font-size:1rem}
.detail-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail-col p{font-size:0.92rem}
@media(max-width:640px){.detail-cols{grid-template-columns:1fr}}

/* ===== Accordion (Эмоции / Ловушки) ===== */
.acc{display:flex;flex-direction:column;gap:10px}
.acc-item{background:var(--card);border:2px solid var(--border);border-radius:14px;overflow:hidden;transition:all 0.2s ease}
.acc-item:hover{border-color:var(--blue)}
.acc-item.open{border-color:var(--red);background:var(--active-bg)}
.acc-head{
  width:100%; background:none; border:none; font:inherit; cursor:pointer;
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:16px 18px; text-align:left;
}
.acc-head .a-title{font-size:1.1rem;font-weight:700;color:var(--h)}
.acc-head .a-arrow{color:var(--hint);font-size:1rem;transition:transform 0.2s ease;flex-shrink:0}
.acc-item.open .a-arrow{transform:rotate(180deg);color:var(--red)}
.acc-body{display:none;padding:0 18px 18px;animation:fadeIn 0.3s ease}
.acc-item.open .acc-body{display:block}
.acc-sec{margin-top:14px}
.acc-sec p{font-size:0.92rem}

/* ===== Animations ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:520px){
  header h1{font-size:1.4rem}
  .tab-btn{flex:1 1 auto;padding:10px 10px;font-size:0.82rem}
  .card .c-title{font-size:1rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hero-photos">
      <img src="fox1.jpg" alt="Лисёнок сидит на столе">
      <img src="fox2.jpg" alt="Лисёнок играет с верёвочками">
    </div>
    <div class="logo-row">
      <img src="sobol-logo.png" alt="Соболь-босс с бабочкой — логотип ADHD Toolkit">
      <h1>ADHD Toolkit</h1>
    </div>
    <p>Навигатор навыков · Таблица эмоций · Когнитивные ловушки</p>
  </header>

  <nav class="tabbar" role="tablist">
    <button class="tab-btn active" data-tab="navigator" role="tab">🧭 Навигатор</button>
    <button class="tab-btn" data-tab="emotions" role="tab">🎭 Эмоции</button>
    <button class="tab-btn" data-tab="traps" role="tab">🕳️ Ловушки</button>

  <!-- ============ TAB 1: Навигатор ============ -->
  <section id="tab-navigator" class="tab-pane active">
    <div id="nav-zones">
      <h2>Что сейчас не так?</h2>
      <div class="grid grid-zones" id="zones-grid"></div>

    <div id="nav-categories" style="display:none">
      <div class="crumb-row">

      </div>
      <div class="grid grid-cats" id="cats-grid"></div>
      <div id="skill-panel"></div>
    </div>
  </section>

  <!-- ============ TAB 2: Эмоции ============ -->
  <section id="tab-emotions" class="tab-pane">
    <h2>Таблица эмоций</h2>
    <div class="acc" id="emotions-acc"></div>
  </section>

  <!-- ============ TAB 3: Ловушки ============ -->
  <section id="tab-traps" class="tab-pane">
    <h2>Когнитивные ловушки</h2>
    <div class="acc" id="traps-acc"></div>
  </section>
</div>

<script>
const DATA = {"zones": [{"name": "Запуск и торможение", "emoji": "⚡", "categories": [{"name": "Не могу начать", "problems": [{"name": "Не могу начать, хотя понимаю что надо", "selftalk": ["\"Я ленивая\""], "skills": [{"skill": "Правило 2 минут", "todo": "Скажи вслух: \"только 2 минуты\". Поставь таймер. Начни самую тупую часть.", "why": "Мозг не сопротивляется короткому отрезку. Инерция и дофамин тянут дальше."}]}, {"name": "Знаю что делать, но не делаю", "selftalk": ["\"Нет мотивации\""], "skills": [{"skill": "Якорная привычка", "todo": "Выбери привычку которая есть (кофе). Сразу после нее - новое действие.", "why": "Готовый нейронный путь. Мотивация не нужна."}]}, {"name": "Откладываю, хочу идеально", "selftalk": ["\"Я прокрастинатор\""], "skills": [{"skill": "Ugly first draft", "todo": "Напиши первое предложение максимально плохо. Буквально.", "why": "Перфекционизм блокирует старт. Разрешение на \"уродливо\" снимает блок."}]}, {"name": "Сижу и не могу двинуться", "selftalk": ["\"Что-то со мной не так\""], "skills": [{"skill": "Обратный отсчет", "todo": "5, 4, 3, 2, 1 - на \"1\" встань или открой файл.", "why": "Счет активирует моторную кору и прерывает петлю."}]}, {"name": "Задача огромная", "selftalk": ["\"Не справлюсь\""], "skills": [{"skill": "Микродекомпозиция", "todo": "Разбей на шаги по 5-10 минут. Сделай только первый.", "why": "Каждый кусок дает микродозу дофамина."}]}, {"name": "Мозг хочет, тело нет", "selftalk": ["\"Я сломана\""], "skills": [{"skill": "Вход через тело", "todo": "Встань. Пройдись. Налей воды. Потом задача.", "why": "Движение активирует дофамин до когнитивной работы."}]}]}, {"name": "Залипаю и не могу остановиться", "problems": [{"name": "Залипаю часами", "selftalk": ["\"Моя суперсила\""], "skills": [{"skill": "Мягкие таймеры", "todo": "Time Timer или вибрация каждые 45-60 минут.", "why": "Плавный сигнал не вызывает стресс."}]}, {"name": "Не могу остановиться", "selftalk": ["\"Еще 5 минут...\""], "skills": [{"skill": "Следующий шаг", "todo": "Перед фокусом запиши: \"после этого я делаю X\".", "why": "Переход проще когда решение принято заранее."}]}, {"name": "Дезориентация после выхода", "selftalk": ["\"Где я, что случилось\""], "skills": [{"skill": "Смена контекста", "todo": "Встань. Выйди. Включи/выключи свет.", "why": "Смена среды \"закрывает вкладку\"."}]}, {"name": "Не слышу, когда обращаются", "selftalk": ["\"Плевать на людей\""], "skills": [{"skill": "Партнер-прерыватель", "todo": "Рука на плечо или кодовое слово. Не голос издалека.", "why": "Физический сигнал пробивается в гиперфокус."}]}]}, {"name": "\"Надо\" блокирует", "problems": [{"name": "Хочу, но \"надо\" блокирует", "selftalk": ["\"Саботирую себя\""], "skills": [{"skill": "\"Я выбираю\"", "todo": "Замени \"надо\" на \"я 20 минут поработаю с данными\". Или \"я выбираю сделать щас, чтоб вечером в кафе\".", "why": "Дорсолатеральная ПФК + стресс-ответ при \"надо\". Вентромедиальная ПФК (автономия) при \"выбираю\". Другой маршрут."}]}, {"name": "Простая задача, тело нет", "selftalk": ["\"Ленивая\""], "skills": [{"skill": "Элемент выбора", "todo": "\"Какую часть первой?\" Дай себе выбор.", "why": "Приказ = \"замри\". Выбор переключает из угрозы в агентность."}]}, {"name": "\"Должна\" = отвращение", "selftalk": ["\"Инфантильная\""], "skills": [{"skill": "Замена слова", "todo": "Вычеркни \"должна\". Замени на \"решила\", \"выбираю\".", "why": "Другие области мозга, минуя сопротивление."}]}, {"name": "Ступор перед скучным", "selftalk": ["\"Нормальные просто делают\""], "skills": [{"skill": "Дофаминовая загрузка", "todo": "5 минут приятного ДО скучного.", "why": "Мозг с дофамином запускает скучное легче."}]}]}]}, {"name": "Фокус и хаос", "emoji": "🎯", "categories": [{"name": "Отвлекаюсь", "problems": [{"name": "Постоянно отвлекаюсь", "selftalk": ["\"Дефицит внимания\""], "skills": [{"skill": "Многопоток", "todo": "Фоновая музыка + главная задача. Разреши параллельный поток.", "why": "Фоновая стимуляция поддерживает дофамин. Твоя архитектура."} /* ================= Табы ================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $('#tab-' + btn.dataset.tab).classList.add('active');
  });
});

/* ================= Навигатор: Уровень 1 — зоны ================= */
const zonesGrid = $('#zones-grid');
DATA.zones.forEach((zone, zi) => {
  const card = el('div', 'card');
  card.appendChild(sobolImg(ZONE_IMG[zone.name], zone.name));
  card.appendChild(el('div', 'c-title', zone.name));
  card.appendChild(el('div', 'c-sub', zone.categories.map(c => c.name).join(' / ')));
  card.addEventListener('click', () => openZone(zi));
  zonesGrid.appendChild(card);
});

/* ================= Навигатор: Уровень 2 — категории ================= */
function openZone(zi) {
  const zone = DATA.zones[zi];
  $('#nav-zones').style.display = 'none';
  $('#nav-categories').style.display = 'block';
  $('#zone-title').textContent = zone.emoji + ' ' + zone.name;
  $('#skill-panel').innerHTML = '';

  const grid = $('#cats-grid');
  grid.innerHTML = '';
  zone.categories.forEach(cat => {
    const card = el('div', 'card');
    card.appendChild(sobolImg(CAT_IMG[cat.name], cat.name));
    card.appendChild(el('div', 'c-title', cat.name));
    const cardSelfTalk = CAT_CARD_SELF_TALK[cat.name] ||
      [...new Set(cat.problems.flatMap(p => p.selftalk))].join(' / ');
    card.appendChild(el('div', 'c-selftalk', cardSelfTalk));
    card.addEventListener('click', () => {
      grid.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      openCategory(zone, cat);
    });
    grid.appendChild(card);
  });
  window.scrollTo({top: 0, behavior: 'smooth'});
}

$('#back-to-zones').addEventListener('click', () => {
  $('#nav-categories').style.display = 'none';
  $('#nav-zones').style.display = 'block';
});

/* ================= Навигатор: Уровень 3 — навыки ================= */
function openCategory(zone, cat) {
  const panel = $('#skill-panel');
  panel.innerHTML = '';

  const box = el('div', 'panel');

  // Блок «Что ты себе говоришь» (+ развёрнутое описание, если есть)
  const intro = CAT_INTRO[cat.name];
  if (intro) {
    const ib = el('div', 'intro-box');
    ib.appendChild(el('div', 'i-quote', intro.quote));
    ib.appendChild(el('div', 'i-text', intro.text));
    box.appendChild(ib);
  } else {
    const stBox = el('div', 'selftalk-box');
    stBox.appendChild(el('span', 'tag tag-red', 'Что ты себе говоришь'));
    const selftalkAll = [...new Set(cat.problems.flatMap(p => p.selftalk))];
    stBox.appendChild(el('div', 'st-list', selftalkAll.join(' · ')));
    box.appendChild(stBox);
  }

  // Блок «Навыки» — чипсы
  box.appendChild(el('span', 'tag tag-purple', 'Навыки'));
  const chips = el('div', 'chips');
  const detailHost = el('div');

  cat.problems.forEach(prob => {
    prob.skills.forEach(sk => {
      const chip = el('button', 'chip', sk.skill);
      chip.addEventListener('click', () => {
        chips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderSkillDetail(detailHost, prob, sk);
      });
      chips.appendChild(chip);
    });
  });
  box.appendChild(chips);
  box.appendChild(detailHost);

  // Навигация
  const nav = el('div', 'panel-nav');
  const b1 = el('button', 'back-btn', '← К проблемам');
  b1.addEventListener('click', () => {
    panel.innerHTML = '';
    $('#cats-grid').querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    $('#cats-grid').scrollIntoView({behavior: 'smooth', block: 'start'});
  });
  const b2 = el('button', 'back-btn', '← К зонам');
  b2.addEventListener('click', () => {
    $('#nav-categories').style.display = 'none';
    $('#nav-zones').style.display = 'block';
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
  nav.appendChild(b1); nav.appendChild(b2);
  box.appendChild(nav);

  panel.appendChild(box);
  box.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function renderSkillDetail(host, prob, sk) {
  host.innerHTML = '';
  const d = el('div', 'detail-box');
  d.appendChild(el('div', 'd-problem', prob.name));

  const cols = el('div', 'detail-cols');

  const c1 = el('div', 'detail-col');
  c1.appendChild(el('span', 'tag tag-blue', 'Что делать'));
  c1.appendChild(el('p', null, sk.todo));

  const c2 = el('div', 'detail-col');
  c2.appendChild(el('span', 'tag tag-purple', 'Почему работает'));
  c2.appendChild(el('p', null, sk.why));

  cols.appendChild(c1); cols.appendChild(c2);
  d.appendChild(cols);
  host.appendChild(d);
  d.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

/* ================= Аккордеон (общий) ================= */
function buildAccordion(host, items, renderBody) {
  items.forEach(item => {
    const wrap = el('div', 'acc-item');
    const head = el('button', 'acc-head');
    head.appendChild(el('span', 'a-title', item.name));
    head.appendChild(el('span', 'a-arrow', '▼'));
    const body = el('div', 'acc-body');
    renderBody(body, item);
    head.addEventListener('click', () => {
      const wasOpen = wrap.classList.contains('open');
      host.querySelectorAll('.acc-item').forEach(i => i.classList.remove('open'));
      if (!wasOpen) wrap.classList.add('open');
    });
    wrap.appendChild(head); wrap.appendChild(body);
    host.appendChild(wrap);
  });
}
function accSec(body, tagCls, tagText, content) {
  const sec = el('div', 'acc-sec');
  sec.appendChild(el('span', 'tag ' + tagCls, tagText));
  sec.appendChild(el('p', null, content));
  body.appendChild(sec);
}

/* ================= Эмоции ================= */
buildAccordion($('#emotions-acc'), DATA.emotions, (body, e) => {
  accSec(body, 'tag-green',  'Слабая интенсивность',  e.weak);
  accSec(body, 'tag-yellow', 'Средняя интенсивность', e.mid);
  accSec(body, 'tag-red',    'Высокая интенсивность', e.strong);
  accSec(body, 'tag-purple', 'Сигнал тела',           e.body);
  accSec(body, 'tag-blue',   'Что эмоция говорит тебе', e.message);
});

/* ================= Ловушки ================= */
buildAccordion($('#traps-acc'), DATA.traps, (body, t) => {
  accSec(body, 'tag-purple', 'Что это', t.what);
  accSec(body, 'tag-red',    'Пример (как звучит в голове)', t.example);
  accSec(body, 'tag-green',  'Что делать', t.todo);
  if (t.adhd) accSec(body, 'tag-yellow', 'Почему при ADHD это сильнее', t.adhd);
});
