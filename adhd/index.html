/* ================= Навигатор: Уровень 1 - зоны ================= */
function renderZones() {
  const zonesGrid = $('#zones-grid');
  zonesGrid.innerHTML = '';
  DATA.zones.forEach((zone, zi) => {
    const card = el('div', 'card');
    card.appendChild(sobolImg(ZONE_IMG[zone.id], zone.name));
    card.appendChild(el('div', 'c-title', zone.name));
    card.appendChild(el('div', 'c-sub', zone.categories.map(c => c.name).join(' / ')));
    card.addEventListener('click', () => openZone(zi));
    zonesGrid.appendChild(card);
  });
}

/* ================= Навигатор: Уровень 2 - категории ================= */
function openZone(zi) {
  state.zone = zi; state.cat = null; state.skill = null;
  renderZoneLevel();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderZoneLevel() {
  const zone = DATA.zones[state.zone];
  $('#nav-zones').style.display = 'none';
  $('#nav-categories').style.display = 'block';
  $('#zone-title').textContent = zone.name;
  $('#skill-panel').innerHTML = '';

  const grid = $('#cats-grid');
  grid.innerHTML = '';
  zone.categories.forEach((cat, ci) => {
    const card = el('div', 'card');
    if (state.cat === ci) card.classList.add('selected');
    card.appendChild(sobolImg(CAT_IMG[cat.id], cat.name));
    card.appendChild(el('div', 'c-title', cat.name));
    const intro = DESC[cat.id];
    const cardSelfTalk = intro ? intro.quote.replace(/^[«"]|[»"]$/g, '')
      : [...new Set(cat.problems.flatMap(p => p.selftalk))].join(' / ');
    card.appendChild(el('div', 'c-selftalk', cardSelfTalk));
    card.addEventListener('click', () => {
      state.cat = ci; state.skill = null;
      grid.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      renderSkillPanel();
    });
    grid.appendChild(card);
  });
}

$('#back-to-zones').addEventListener('click', backToZones);
function backToZones() {
  state.zone = null; state.cat = null; state.skill = null;
  $('#nav-categories').style.display = 'none';
  $('#nav-zones').style.display = 'block';
}

/* ================= Навигатор: Уровень 3 - навыки ================= */
function renderSkillPanel() {
  const zone = DATA.zones[state.zone];
  const cat = zone.categories[state.cat];
  const panel = $('#skill-panel');
  panel.innerHTML = '';

  const box = el('div', 'panel');

  // Развёрнутое описание (или короткий self-talk, если описания нет)
  const intro = DESC[cat.id];
  if (intro) {
    const ib = el('div', 'intro-box');
    ib.appendChild(el('div', 'i-quote', intro.quote));
    ib.appendChild(el('div', 'i-text', intro.text));
    box.appendChild(ib);
  } else {
    const stBox = el('div', 'selftalk-box');
    stBox.appendChild(el('span', 'tag tag-red', T.tagSelfTalk));
    const selftalkAll = [...new Set(cat.problems.flatMap(p => p.selftalk))];
    stBox.appendChild(el('div', 'st-list', selftalkAll.join(' · ')));
    box.appendChild(stBox);
  }

  // Блок «Навыки» - чипсы
  box.appendChild(el('span', 'tag tag-purple', T.tagSkills));
  const chips = el('div', 'chips');
  const detailHost = el('div');

  let flatIndex = 0;
  cat.problems.forEach(prob => {
    prob.skills.forEach(sk => {
      const idx = flatIndex++;
      const chip = el('button', 'chip', sk.skill);
      if (state.skill === idx) chip.classList.add('active');
      chip.addEventListener('click', () => {
        state.skill = idx;
        chips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderSkillDetail(detailHost, prob, sk);
      });
      chips.appendChild(chip);
    });
  });
  box.appendChild(chips);
  box.appendChild(detailHost);

  // Восстановление открытого навыка (при смене языка)
  if (state.skill !== null) {
    let i = 0, found = null;
    cat.problems.forEach(prob => prob.skills.forEach(sk => {
      if (i++ === state.skill) found = {prob, sk};
    }));
    if (found) renderSkillDetail(detailHost, found.prob, found.sk);
  }

  // Навигация
  const nav = el('div', 'panel-nav');
  const b1 = el('button', 'back-btn', T.backCats);
  b1.addEventListener('click', () => {
    state.cat = null; state.skill = null;
    panel.innerHTML = '';
    $('#cats-grid').querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    $('#cats-grid').scrollIntoView({behavior: 'smooth', block: 'start'});
  });
  const b2 = el('button', 'back-btn', T.backZones);
  b2.addEventListener('click', () => {
    backToZones();
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
  nav.appendChild(b1); nav.appendChild(b2);
  box.appendChild(nav);

  panel.appendChild(box);
  box.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function renderSkillDetail(host, prob, sk) {
  host.innerHTML = '';
  const d = el('div', 'detail-box');
  d.appendChild(el('div', 'd-problem', prob.name));

  const cols = el('div', 'detail-cols');

  const c1 = el('div', 'detail-col');
  c1.appendChild(el('span', 'tag tag-blue', T.tagWhatToDo));
  c1.appendChild(el('p', null, sk.todo));

  const c2 = el('div', 'detail-col');
  c2.appendChild(el('span', 'tag tag-purple', T.tagWhy));
  c2.appendChild(el('p', null, sk.why));

  cols.appendChild(c1); cols.appendChild(c2);
  d.appendChild(cols);
  host.appendChild(d);
  d.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

/* ================= Аккордеон (общий) ================= */

/* ================= Лайтбокс для соболей ================= */
const lightbox = $('#lightbox');
const lightboxImg = $('#lightbox-img');

function openLightbox(src, alt) {
  lightboxImg.src = src;
  lightboxImg.alt = alt || '';
  lightbox.classList.add('open');
  requestAnimationFrame(() => requestAnimationFrame(() => lightbox.classList.add('visible')));
}
function closeLightbox() {
  lightbox.classList.remove('visible');
  setTimeout(() => lightbox.classList.remove('open'), 230);
}
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
$('#lightbox-close').addEventListener('click', closeLightbox);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
});
function makeZoomable(img) {
  img.addEventListener('click', (e) => {
    e.stopPropagation();
    openLightbox(img.src, img.alt);
  });
}

function buildAccordion(host, items, renderBody, imgs) {
  host.innerHTML = '';
  items.forEach((item, idx) => {
    const wrap = el('div', 'acc-item');
    const head = el('button', 'acc-head');
    let img = null;
    if (imgs && imgs[idx]) {
      img = sobolImg(imgs[idx], item.name);
      img.classList.add('acc-mascot');
      head.appendChild(img);
    }
    head.appendChild(el('span', 'a-title', item.name));
    head.appendChild(el('span', 'a-arrow', '▼'));
    const body = el('div', 'acc-body');
    renderBody(body, item);
    head.addEventListener('click', () => {
      const wasOpen = wrap.classList.contains('open');
      host.querySelectorAll('.acc-item').forEach(i => {
        if (i.classList.contains('open')) {
          i.classList.remove('open');
          collapseMascot(i);
        }
      });
      if (!wasOpen) {
        wrap.classList.add('open');
        expandMascot(wrap);
      }
    });
    wrap.appendChild(head); wrap.appendChild(body);
    host.appendChild(wrap);
  });
}

/* ---- mascot move animation (FLIP) ---- */
function expandMascot(wrap) {
  const img = wrap.querySelector('.acc-mascot');
  const body = wrap.querySelector('.acc-body');
  if (!img || !body) return;
  const first = img.getBoundingClientRect();
  body.insertBefore(img, body.firstChild);
  const last = img.getBoundingClientRect();
  const dx = first.left - last.left;
  const dy = first.top - last.top;
  const scale = first.height / Math.max(last.height, 1);
  img.style.transition = 'none';
  img.style.transformOrigin = 'top right';
  img.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      img.style.transition = 'transform 0.26s ease-in-out';
      img.style.transform = '';
    });
  });
}
function collapseMascot(wrap) {
  const img = wrap.querySelector('.acc-mascot');
  const head = wrap.querySelector('.acc-head');
  if (!img || !head) return;
  const first = img.getBoundingClientRect();
  head.insertBefore(img, head.firstChild);
  const last = img.getBoundingClientRect();
  const dx = first.left - last.left;
  const dy = first.top - last.top;
  const scale = first.height / Math.max(last.height, 1);
  img.style.transition = 'none';
  img.style.transformOrigin = 'top left';
  img.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      img.style.transition = 'transform 0.26s ease-in-out';
      img.style.transform = '';
    });
  });
}

function accSec(body, tagCls, tagText, content) {
  const sec = el('div', 'acc-sec');
  sec.appendChild(el('span', 'tag ' + tagCls, tagText));
  sec.appendChild(el('p', null, content));
  body.appendChild(sec);
}

/* ================= Эмоции / Ловушки ================= */
function renderEmotions() {
  buildAccordion($('#emotions-acc'), DATA.emotions, (body, e) => {
    accSec(body, 'tag-green',  T.emoWeak,    e.weak);
    accSec(body, 'tag-yellow', T.emoMid,     e.mid);
    accSec(body, 'tag-red',    T.emoStrong,  e.strong);
    accSec(body, 'tag-purple', T.emoBody,    e.body);
    accSec(body, 'tag-blue',   T.emoMessage, e.message);
  }, EMO_IMG[LANG]);
}
function renderTraps() {
  buildAccordion($('#traps-acc'), DATA.traps, (body, t) => {
    accSec(body, 'tag-purple', T.trapWhat,    t.what);
    accSec(body, 'tag-red',    T.trapExample, t.example);
    accSec(body, 'tag-green',  T.trapDo,      t.todo);
    if (t.adhd) accSec(body, 'tag-yellow', T.trapAdhd, t.adhd);
  }, TRAP_IMG);
}

/* ================= Полный рендер ================= */
function renderAll() {
  applyStaticTexts();
  renderZones();
  if (state.zone !== null) renderZoneLevel();
  if (state.cat !== null) renderSkillPanel();
  renderEmotions();
  renderTraps();
}

/* ================= Бадди: раскрытие вступления ================= */
function togglePreface() {
  $('#preface-panel').classList.toggle('open');
}
$('#buddy').addEventListener('click', togglePreface);

/* ================= Переключатель языка ================= */
$('#lang-toggle').addEventListener('click', () => {
  const next = LANG === 'ru' ? 'en' : 'ru';
  localStorage.setItem('adhd-lang', next);
  window.location.href = next === 'en' ? '/en/adhd/' : '/adhd/';

renderAll();
